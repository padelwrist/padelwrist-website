name: Visual design audit

on:
  push:
    branches:
      - design/m3-system-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/padelwrist-server.log 2>&1 &
          sleep 2
      - name: Capture responsive audit
        run: node scripts/visual-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: visual-audit
          path: visual-audit/
          retention-days: 7
