name: Publish PadelWrist 1.3 website content

on:
  push:
    branches: [main]
    paths:
      - 'scripts/release-v13-live.py'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update website for live 1.3 release
        run: python3 scripts/release-v13-live.py
      - name: Commit website updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Website already reflects 1.3.'
            exit 0
          fi
          git config user.name 'PadelWrist Website Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/site.js whats-new/index.html padel-player-statistics/index.html padel-match-sharing/index.html padel-match-history/index.html apple-watch-padel-scoring/index.html fixed-points-padel-scoring/index.html
          git commit -m 'Publish PadelWrist 1.3 website content'
          git push
