name: Finalise M3 layout audit

on:
  push:
    branches:
      - design/m3-system-audit
    paths:
      - scripts/m3-finalise.py

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/m3-finalise.py
      - name: Commit final layout corrections
        run: |
          git config user.name 'PadelWrist Website Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/pages.css assets/home.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Resolve final grid and rhythm inconsistencies'
          git push
