name: Fix website footer

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-footer.py'

permissions:
  contents: write

jobs:
  fix-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/fix-footer.py
      - name: Commit footer cleanup
        shell: bash
        run: |
          git config user.name 'PadelWrist Website Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/site.js assets/tokens.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Clean up website footer'
          git push
