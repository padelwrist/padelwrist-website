name: Publish PadelWrist 1.4 website refresh

on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish-v14-site-refresh.py'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/publish-v14-site-refresh.py
      - name: Commit website refresh
        shell: bash
        run: |
          git config user.name 'PadelWrist Website Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh website for PadelWrist 1.4'
          git push
