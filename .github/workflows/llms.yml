name: Refresh llms.txt manually

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: padelwrist-seo-content-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate llms.txt
        run: python3 scripts/generate-llms.py

      - name: Commit llms.txt when content changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- llms.txt; then
            echo 'llms.txt already current.'
            exit 0
          fi
          git config user.name 'PadelWrist SEO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add llms.txt
          git commit -m 'Refresh llms.txt knowledge index'
          git pull --rebase origin main
          git push origin main
