name: One-off Google indexing submission

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/google-indexing-once.trigger

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check google-auth requests

      - name: Submit sitemap URLs once
        env:
          GOOGLE_INDEXING_API_JSON: ${{ secrets.GOOGLE_INDEXING_API_JSON }}
        run: python scripts/google-indexing-once.py
