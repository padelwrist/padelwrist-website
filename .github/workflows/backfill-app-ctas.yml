name: Backfill missing app CTAs

on:
  push:
    branches: [main]
    paths:
      - 'scripts/backfill-app-ctas.py'
      - '.github/workflows/backfill-app-ctas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add app promotion where missing
        run: python3 scripts/backfill-app-ctas.py

      - name: Commit updated knowledge pages
        shell: bash
        run: |
          if git diff --quiet -- '*/index.html'; then
            echo 'All relevant article pages already promote PadelWrist.'
            exit 0
          fi
          git config user.name 'PadelWrist SEO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add '*/index.html'
          git commit -m 'Backfill PadelWrist app CTAs across knowledge base'
          git push
