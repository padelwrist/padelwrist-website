name: Submit URLs to IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: indexnow-full-site
  cancel-in-progress: true

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Cloudflare deployment
        if: github.event_name == 'push'
        run: sleep 60

      - name: Build full sitemap URL list
        id: urls
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 10 https://padelwrist.com/sitemap.xml \
            | grep -oE '<loc>[^<]+</loc>' \
            | sed -E 's#</?loc>##g' \
            | grep -E '^https://padelwrist\.com/' \
            | sort -u > urls.txt

          count="$(wc -l < urls.txt | tr -d ' ')"
          test "$count" -gt 0
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Submitting the full sitemap: $count URL(s)"
          cat urls.txt

      - name: Verify IndexNow key is live
        shell: bash
        env:
          INDEXNOW_KEY: 66805d2275b749c9b7cc0cf2e9c19d95
        run: |
          set -euo pipefail
          value="$(curl --fail --silent --show-error --retry 5 --retry-delay 10 "https://padelwrist.com/${INDEXNOW_KEY}.txt")"
          test "$value" = "$INDEXNOW_KEY"

      - name: Submit full sitemap to IndexNow
        shell: bash
        env:
          INDEXNOW_KEY: 66805d2275b749c9b7cc0cf2e9c19d95
          SITE_HOST: padelwrist.com
        run: |
          set -euo pipefail
          url_list="$(jq -R . < urls.txt | jq -s .)"
          payload="$(jq -n \
            --arg host "$SITE_HOST" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://padelwrist.com/${INDEXNOW_KEY}.txt" \
            --argjson urlList "$url_list" \
            '{host:$host,key:$key,keyLocation:$keyLocation,urlList:$urlList}')"

          echo "Submitting $(wc -l < urls.txt) URL(s) to IndexNow..."
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data "$payload" https://api.indexnow.org/indexnow)"
          cat "$response_file" || true
          echo
          echo "IndexNow HTTP status: $status"
          case "$status" in 200|202) exit 0 ;; *) exit 1 ;; esac
