name: Apply premium inner-page refresh

on:
  push:
    branches: [main]
    paths:
      - 'scripts/premium-inner-pages-refresh.py'
      - '.github/workflows/premium-inner-pages-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply premium inner-page pass
        run: python3 scripts/premium-inner-pages-refresh.py
      - name: Commit shared design changes
        shell: bash
        run: |
          git config user.name 'PadelWrist Website Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/site.js assets/site.css assets/pages.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Roll premium design across inner pages'
          git push
