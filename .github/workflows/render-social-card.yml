name: Render social card

on:
  push:
    branches: [main]
    paths:
      - 'assets/padelwrist-social-card.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer
        run: python -m pip install --disable-pip-version-check cairosvg

      - name: Render PNG
        run: |
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url='assets/padelwrist-social-card.svg',
              write_to='assets/padelwrist-social-card.png',
              output_width=1200,
              output_height=630,
          )
          PY

      - name: Commit rendered PNG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/padelwrist-social-card.png
          if git diff --cached --quiet; then
            echo 'PNG already up to date.'
            exit 0
          fi
          git commit -m 'Render PadelWrist social card PNG'
          git push
