<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">PadelWrist social preview</title>
<desc id="desc">PadelWrist padel scoring for Apple Watch, iPhone and iPad</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07131e"/>
    <stop offset="1" stop-color="#0d2433"/>
  </linearGradient>
  <radialGradient id="glow" cx="78%" cy="20%" r="62%">
    <stop offset="0" stop-color="#335fff" stop-opacity=".55"/>
    <stop offset="1" stop-color="#335fff" stop-opacity="0"/>
  </radialGradient>
